services:
  - name: portfolink-server
    type: web
    runtime: nodejs
    regions:
      - par
    git:
      repository: https://github.com/chethaner/protfolink
      branch: main
    build:
      workdir: server
      buildCommand: npm install
    deployment:
      workdir: server
      command: node server.js
      ports:
        - port: 5000
          protocol: http
    env:
      - name: NODE_ENV
        value: production
      - name: PORT
        value: "5000"
      - name: MONGO_URI
        type: secret
        secret: MONGO_URI
      - name: JWT_SECRET
        type: secret
        secret: JWT_SECRET
      - name: GROQ_API_KEY
        type: secret
        secret: GROQ_API_KEY
      - name: GROQ_MODEL
        value: qwen/qwen3.8-27b
