services:
  # ── Backend ── Node.js Web Service (free tier)
  - type: web
    name: portfolink-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    numInstances: 1
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  # ── Frontend ── Static Site (always-on, CDN, free)
  - type: web
    env: static
    name: portfolink-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
