services:
  # ── Backend ── Docker Web Service (free tier, sleeps after 15 min inactivity)
  - type: web
    name: portfolink-server
    runtime: docker
    plan: free
    rootDir: server
    dockerfilePath: ./Dockerfile
    numInstances: 1
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  # ── Frontend ── Static Site (always-on, CDN, no sleep, no Docker needed)
  - type: static
    name: portfolink-client
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

