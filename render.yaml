services:
  # ── Backend ── Docker Web Service (sleeps after 15 min inactivity on free account)
  - type: web
    name: portfolink-server
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    numInstances: 1
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false

  # ── Frontend ── Static Site (always-on, CDN, no sleep)
  - type: web
    env: static
    name: portfolink-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

